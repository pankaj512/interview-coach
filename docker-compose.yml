services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_coach}
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-coach} -d $${POSTGRES_DB:-interview_coach}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Product API (HLD Phase 8, S8b). Boot migrates, then serves.
  # Seed once explicitly: docker compose run --rm backend pnpm --filter @interview-coach/db db:seed
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # F8-6: set at the process level so prod guards (auth fail-safe, runner
      # gate) see it consistently, not only via the image's Dockerfile.
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-coach}:${POSTGRES_PASSWORD:-coach_dev_only}@db:5432/${POSTGRES_DB:-interview_coach}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      # F7-4/F8-2: production refuses to boot open; the demo stack opts in
      # explicitly. Set API_AUTH_TOKEN for anything real.
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-true}
      AZURE_VOICE_ENDPOINT: ${AZURE_VOICE_ENDPOINT:-https://interview-coach-voice.services.ai.azure.com}
      AZURE_VOICE_API_KEY: ${AZURE_VOICE_API_KEY:-}
      AZURE_VOICE_MODEL: ${AZURE_VOICE_MODEL:-gpt-realtime-mini}
      AZURE_VOICE_API_VERSION: ${AZURE_VOICE_API_VERSION:-2026-04-10}
      AZURE_VOICE_VOICE: ${AZURE_VOICE_VOICE:-alloy}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Feature 16: the Docker sandbox runner drives per-run containers
      # through the host daemon. Without this mount, runs persist as errors.
      - /var/run/docker.sock:/var/run/docker.sock

  # Static web client (nginx). The browser calls the backend directly at
  # VITE_BACKEND_URL (frozen §2); edit it when the backend is not on
  # localhost:3000 from the browser's perspective.
  web:
    build:
      context: .
      dockerfile: packages/web-client/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
