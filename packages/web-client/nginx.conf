# SPA fallback + immutable asset caching. The API is NOT proxied here: the
# browser calls the backend directly at VITE_BACKEND_URL (frozen §2 control
# plane), so this server is static-only and cookie/auth-free.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
